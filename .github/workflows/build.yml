name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Подписываю постоянным ключом."
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан debug-ключом и не обновится поверх старой версии."
          fi

      - name: Build APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Выносим ошибки компиляции в аннотации, чтобы их было видно без логина.
          grep -E "^e: |What went wrong|error:" -A4 build.log | head -15 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done
          msg=$(grep -E "^e: |What went wrong|error:|Could not|> " build.log | head -80 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${msg}"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GrumpWeather-v1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GrumpWeather-v1.${{ github.run_number }}
          path: GrumpWeather-*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Ворчливая погода v1.${{ github.run_number }}
          body: Свежий APK. Качай, ставь поверх старого.
          files: GrumpWeather-*.apk
          make_latest: true
